# Fly.io: one always-on machine. The 60-second loop, the scheduled briefs and push all run inside this
# process, so the machine must never stop when nobody has the app open.
#
# First deploy, from this directory (desk/). Nothing here has been run from the build environment:
#
#   1. Create the app (keeps this file, deploys nothing yet). Pick your own app name and region:
#        fly launch --no-deploy --copy-config --name <your-app> --region ewr
#
#   2. Attach Postgres and Redis:
#        fly postgres create --name <your-app>-db --region ewr && fly postgres attach <your-app>-db
#          (attach sets the DATABASE_URL secret. Plain Postgres is fine: the Timescale migration skips
#           itself when the extension is not available and candles stay an ordinary table.)
#        fly redis create --name <your-app>-redis --region ewr --no-eviction
#          (Upstash. It prints a redis:// URL; that is REDIS_URL in step 3. BullMQ needs eviction off.)
#
#   3. Set secrets, then deploy:
#        fly secrets set DESK_TOKEN='<a long passphrase>' REDIS_URL='<url from step 2>' \
#          VAPID_SUBJECT='mailto:<you>' TV_WEBHOOK_SECRET='<random string>'
#        fly deploy
#
# Optional secrets, same names as .env.example: VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY (otherwise a pair is
# generated on first boot and kept in the database), TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (P0 fallback),
# ANTHROPIC_API_KEY, DESK_TZ, and one key per paid feed.
# Kill switch: POST /api/admin/kill {"on": true} stops every scheduled job without a deploy.

app = "desk"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# One machine holds the scheduler; a second would run every job twice.
[deploy]
  strategy = "immediate"
