name: desk-ci

on:
  push:
    paths: ["desk/**", ".github/workflows/desk-ci.yml"]
  pull_request:
    paths: ["desk/**", ".github/workflows/desk-ci.yml"]

concurrency:
  group: desk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desk
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: desk
          POSTGRES_PASSWORD: desk
          POSTGRES_DB: desk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk -d desk" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # With these set the PgStore conformance suite and the Redis bus and BullMQ scheduler tests run, not skip.
      DATABASE_URL: postgres://desk:desk@localhost:5432/desk
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desk/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desk/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build web
        run: pnpm build:web

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t desk:ci desk
